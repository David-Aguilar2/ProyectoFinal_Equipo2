{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Sistema Clínica {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/form.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/redes.css' %}">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
            <div class="container-fluid">
                <p class="navbar-brand navbar-brand-custom">Sistema de Gestión Clínica</p>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="{% url 'core:menu' %}">
                                <img src="{% static 'core/svg/home.svg' %}" alt="Inicio" class="me-1" width="20">
                                Menú
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="{% url 'core:contactenos' %}">
                                <img src="{% static 'core/svg/contacto.svg' %}" alt="Inicio" class="me-1" width="20">
                                Contactenos
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5 pt-4">
        <!-- Contenido dinámico -->
        {% block content %}

        {% endblock %}
    </main>

    <footer class="footer-custom text-center">
        <div class="container">
            <p class="text-accent">Sistema de Gestión Clínica &copy; {% now "Y" %}</p>
            <small class="text-accent">Desarrollado para una atención médica de calidad</small>
        </div>
    </footer>

    <script src="{% static 'core/js/bootstrap/bootstrap.min.js' %}"></script>
</body>

</html>
